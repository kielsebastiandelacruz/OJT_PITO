{% extends "blog/base.html" %}
{% block content %}
    <h2>Create a Post (Manual)</h2>
    <form method="POST">
        {% csrf_token %} <label>Title:</label><br>
        <input type="text" name="title"><br>
        <label>Content:</label>
        <textarea name="content"></textarea><br>
        <button type="submit">Submit</button>
    </form>
{% endblock %}
