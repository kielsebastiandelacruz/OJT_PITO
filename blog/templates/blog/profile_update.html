{% extends "blog/base.html" %}

{% block content %}
    <div class="card" style="max-width: 600px; margin: 30px auto; padding: 40px; text-align: center;">
        <h2 style="margin-bottom: 20px;">Update Profile Details</h2>
        
        <div style="display: flex; justify-content: center; margin-bottom: 30px;">
            <img src="{{ user.profile.image.url }}" alt="Profile Image" 
                 style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid #1877F2;">
        </div>

        <form method="POST" enctype="multipart/form-data" style="text-align: left;">
            {% csrf_token %}
            
            {{ u_form.as_p }}
            {{ p_form.as_p }}
            
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn-primary" type="submit" style="padding: 10px 30px; border: none; border-radius: 5px; cursor: pointer;">Save Changes</button>
                <a href="{% url 'user-profile' user.username %}" style="margin-left: 15px; text-decoration: none; color: #6c757d;">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
